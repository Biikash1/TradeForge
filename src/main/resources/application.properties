spring.application.name=TradeForge

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/Trading
spring.datasource.username=root
spring.datasource.password=${PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Integrate Coingecko API
coingecko.base-url=${COINGECKO_URL}

#Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY}
razorpay.key.secret=${RAZORPAY_SECRET}
razorpay.callback.url=${RAZORPAY_CALLBACK_URL}


#Stripe Configuration
stripe.key.secret=${STRIPE_SECRET}
stripe.success.url=${STRIPE_SUCCESS_URL}
stripe.cancel.url=${STRIPE_CANCEL_URL}

#Email Configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

mail.from=${MAIL_FROM}

jwt.secret=${JWT_SECRET}
jwt.expiration=1800000

gemini.api.key=${GEMINI_API_KEY}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.api.model=gemini-3.6-flash
gemini.api.timeout.connect=5000
gemini.api.timeout.read=15000